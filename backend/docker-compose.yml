version: '3.8'

services:
  takt-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takt-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
